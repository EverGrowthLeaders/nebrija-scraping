x-app-environment: &app-environment
  NODE_ENV: production
  DATABASE_URL: postgresql://${POSTGRES_USER:-lexington}:${POSTGRES_PASSWORD:-lexington_dev_password}@postgres:5432/${POSTGRES_DB:-lexington}
  REDIS_URL: redis://redis:6379
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3100}
  QUEUE_PREFIX: ${QUEUE_PREFIX:-lexington}
  WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
  AUTO_DISPATCH_VOICE: ${AUTO_DISPATCH_VOICE:-false}
  TEST_JOBS_API_KEYS: ${TEST_JOBS_API_KEYS:-}
  GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
  GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
  SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-lex_session}
  SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-14}
  CRAWLER_PROVIDER: ${CRAWLER_PROVIDER:-firecrawl}
  CRAWLER_MAX_PAGES_PER_BUSINESS: ${CRAWLER_MAX_PAGES_PER_BUSINESS:-8}
  CRAWLER_REQUEST_TIMEOUT_MS: ${CRAWLER_REQUEST_TIMEOUT_MS:-45000}
  CRAWLER_RESPECT_ROBOTS: ${CRAWLER_RESPECT_ROBOTS:-true}
  FIRECRAWL_BASE_URL: ${FIRECRAWL_BASE_URL:-https://api.firecrawl.dev/v2}
  FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
  FIRECRAWL_ORIGIN_HEADER: ${FIRECRAWL_ORIGIN_HEADER:-}
  APIFY_API_KEY: ${APIFY_API_KEY:-}
  APIFY_FACEBOOK_ADS_ACTOR_ID: ${APIFY_FACEBOOK_ADS_ACTOR_ID:-curious_coder~facebook-ads-library-scraper}
  APIFY_GOOGLE_ADS_ACTOR_ID: ${APIFY_GOOGLE_ADS_ACTOR_ID:-crawlerbros~google-ads-scraper}
  APIFY_RUN_TIMEOUT_SECS: ${APIFY_RUN_TIMEOUT_SECS:-90}
  APIFY_MAX_CHARGED_RESULTS: ${APIFY_MAX_CHARGED_RESULTS:-10}
  ADS_APIFY_FALLBACK_MODE: ${ADS_APIFY_FALLBACK_MODE:-off}
  DEEPINFRA_API_KEY: ${DEEPINFRA_API_KEY:-}
  DEEPINFRA_BASE_URL: ${DEEPINFRA_BASE_URL:-https://api.deepinfra.com/v1/openai}
  ADS_ACTIVITY_AI_MODEL: ${ADS_ACTIVITY_AI_MODEL:-deepseek-ai/DeepSeek-V4-Flash}
  ADS_ACTIVITY_AI_MODE: ${ADS_ACTIVITY_AI_MODE:-always}
  ADS_ACTIVITY_AI_VERIFY_MODE: ${ADS_ACTIVITY_AI_VERIFY_MODE:-always}
  ADS_ACTIVITY_AI_REQUIRE_PLANNED_EVIDENCE: ${ADS_ACTIVITY_AI_REQUIRE_PLANNED_EVIDENCE:-true}
  ADS_ACTIVITY_AI_MAX_EVIDENCE_CHARS: ${ADS_ACTIVITY_AI_MAX_EVIDENCE_CHARS:-22000}
  ADS_ACTIVITY_AI_REQUEST_TIMEOUT_MS: ${ADS_ACTIVITY_AI_REQUEST_TIMEOUT_MS:-45000}
  ADS_FUNNEL_AI_MODEL: ${ADS_FUNNEL_AI_MODEL:-deepseek-ai/DeepSeek-V4-Flash}
  ADS_FUNNEL_AI_MODE: ${ADS_FUNNEL_AI_MODE:-always}
  ADS_FUNNEL_AI_MAX_EVIDENCE_CHARS: ${ADS_FUNNEL_AI_MAX_EVIDENCE_CHARS:-18000}
  ADS_FUNNEL_AI_MAX_VISIBLE_TEXT_CHARS: ${ADS_FUNNEL_AI_MAX_VISIBLE_TEXT_CHARS:-9000}
  ADS_FUNNEL_AI_REQUEST_TIMEOUT_MS: ${ADS_FUNNEL_AI_REQUEST_TIMEOUT_MS:-45000}
  DECISION_MAKER_AI_MODEL: ${DECISION_MAKER_AI_MODEL:-deepseek-ai/DeepSeek-V4-Flash}
  DECISION_MAKER_AI_MODE: ${DECISION_MAKER_AI_MODE:-always}
  DECISION_MAKER_AI_VERIFY_MODE: ${DECISION_MAKER_AI_VERIFY_MODE:-always}
  DECISION_MAKER_AI_REQUIRE_PLANNED_SEARCH: ${DECISION_MAKER_AI_REQUIRE_PLANNED_SEARCH:-true}
  DECISION_MAKER_AI_MAX_EVIDENCE_CHARS: ${DECISION_MAKER_AI_MAX_EVIDENCE_CHARS:-12000}
  DECISION_MAKER_AI_REQUEST_TIMEOUT_MS: ${DECISION_MAKER_AI_REQUEST_TIMEOUT_MS:-30000}
  GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
  GOOGLE_PLACES_BASE_URL: ${GOOGLE_PLACES_BASE_URL:-https://places.googleapis.com/v1}
  GOOGLE_PLACES_FIELD_MASK: ${GOOGLE_PLACES_FIELD_MASK:-places.id,places.displayName,places.formattedAddress,places.location}
  NEBRIJA_API_BASE_URL: ${NEBRIJA_API_BASE_URL:-https://nebrijaai.com/api/v1}
  NEBRIJA_API_KEY: ${NEBRIJA_API_KEY:-}
  NEBRIJA_ASSISTANT_ID: ${NEBRIJA_ASSISTANT_ID:-}
  NEBRIJA_PHONE_NUMBER_ID: ${NEBRIJA_PHONE_NUMBER_ID:-}
  NEBRIJA_WEBHOOK_SECRET: ${NEBRIJA_WEBHOOK_SECRET:-}

services:
  api:
    build: .
    restart: unless-stopped
    command: ["node", "apps/api/src/server.mjs"]
    environment:
      <<: *app-environment
      PORT: 3000
    ports:
      - "${API_PORT:-3100}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    restart: unless-stopped
    command: ["node", "apps/worker/src/index.mjs"]
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lexington}
      POSTGRES_USER: ${POSTGRES_USER:-lexington}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lexington_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lexington} -d ${POSTGRES_DB:-lexington}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
